spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# 라우팅: 서비스 주소는 환경변수로 변경 가능
spring.cloud.gateway.server.webflux.routes[0].id=iot-device-service
spring.cloud.gateway.server.webflux.routes[0].uri=${IOT_DEVICE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/devices/**

spring.cloud.gateway.server.webflux.routes[1].id=monitoring-service
spring.cloud.gateway.server.webflux.routes[1].uri=${MONITORING_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/monitoring/**

# CORS 공통 처리
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# 보안 스위치 + JWT 검증 (Keycloak)
app.security.enabled=${APP_SECURITY_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8090/realms/nilm}