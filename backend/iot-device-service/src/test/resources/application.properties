# 테스트 전용 설정: PostgreSQL 없이 H2 인메모리 DB로 실행된다.
spring.datasource.url=jdbc:h2:mem:device_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.security.enabled=false

# 브로커가 없으므로 릴레이는 돌리지 않는다. 아웃박스에 적히는지까지만 검증한다.
app.manager-registration.publisher.enabled=false
spring.kafka.producer.properties.max.block.ms=100
