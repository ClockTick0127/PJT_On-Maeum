[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-silver-service"
version = "0.1.0"
description = "Daily Spark batch that turns Bronze power records into Silver clean power and household observation days"
requires-python = ">=3.11"
dependencies = [
    "realtime-analysis-service==0.1.0",
    "pyspark==3.5.6",
    "hdfs>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
]

[project.scripts]
power-silver = "power_silver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
power_silver = ["config/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "spark: requires a working local PySpark runtime (JVM + writable local filesystem)",
    "postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
]

[tool.coverage.run]
relative_files = true
