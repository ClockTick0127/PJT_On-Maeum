global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
  - job_name: ai-analysis
    scrape_interval: 1s
    scrape_timeout: 1s
    honor_labels: false
    file_sd_configs:
      - files: ["/etc/prometheus/targets/ai.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [service]
        regex: aggregation-service
        target_label: job
        replacement: aggregation-service
  - job_name: ai-analysis-local-replicas
    scrape_interval: 1s
    scrape_timeout: 1s
    honor_labels: false
    dns_sd_configs:
      - names: ["realtime-analysis-service-local"]
        type: A
        port: 8000
        refresh_interval: 5s
    relabel_configs:
      - target_label: job
        replacement: ai-analysis
      - target_label: service
        replacement: realtime-analysis-service
      - target_label: environment
        replacement: local
  - job_name: service-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/http.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: service-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/tcp.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/resources/cadvisor.json"]
        refresh_interval: 30s
  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node.json"]
        refresh_interval: 30s
