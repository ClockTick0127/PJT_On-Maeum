name: nilm-a
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST required}:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME required}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN required}
      NILM_SMOKE_CLIENT_SECRET: ${NILM_SMOKE_CLIENT_SECRET:?NILM_SMOKE_CLIENT_SECRET required}
    volumes:
      - ${CONFIG_ROOT:-.}/keycloak/nilm-realm.json:/opt/keycloak/data/import/nilm-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 24
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    image: ${REGISTRY:?REGISTRY required}/nilm-api-gateway:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      APP_SECURITY_ENABLED: "true"
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/nilm/protocol/openid-connect/certs
      IOT_DEVICE_SERVICE_URL: http://iot-device-service:8081
      MONITORING_SERVICE_URL: http://monitoring-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS required}
    depends_on:
      keycloak:
        condition: service_healthy
      iot-device-service:
        condition: service_healthy
      monitoring-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  iot-device-service:
    image: ${REGISTRY:?REGISTRY required}/nilm-iot-device-service:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      APP_SECURITY_ENABLED: "true"
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/nilm/protocol/openid-connect/certs
      POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST required}:5432/device_db
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  monitoring-service:
    image: ${REGISTRY:?REGISTRY required}/nilm-monitoring-service:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      APP_SECURITY_ENABLED: "true"
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/nilm/protocol/openid-connect/certs
      POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST required}:5432/monitoring_db
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_HEALTH_ENABLED: "true"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ${CONFIG_ROOT:-.}/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${CONFIG_ROOT:-.}/mqtt/passwd:/mosquitto/config/passwd:ro
      - ${CONFIG_ROOT:-.}/mqtt/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${REGISTRY:?REGISTRY required}/nilm-frontend:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN required}
      NGINX_ENVSUBST_FILTER: "^(APP_DOMAIN|AUTH_DOMAIN)$$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CONFIG_ROOT:-.}/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${CONFIG_ROOT:-.}/certs:/etc/nginx/certs:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    name: nilm-a_redis_data
  mosquitto_data:
    name: nilm-a_mosquitto_data
